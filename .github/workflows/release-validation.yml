name: Validate Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to validate, for example v0.5.2 or v0.5.2-beta1
        required: true
      prerelease:
        description: Whether the release should be treated as a prerelease
        required: true
        type: boolean

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag_name="${{ github.event.inputs.tag_name }}"
            prerelease="${{ github.event.inputs.prerelease }}"
          else
            tag_name="${{ github.event.release.tag_name }}"
            prerelease="${{ github.event.release.prerelease }}"
          fi

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Validate release tag, metadata, and stamped versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: python3 scripts/validate_release_source.py --tag "$RELEASE_TAG" --prerelease "$RELEASE_PRERELEASE"
