name: Validate Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to validate, for example v0.5.2, v0.5.2-alpha1, or v0.5.2-beta1
        required: true
      prerelease:
        description: Whether the release should be treated as a prerelease
        required: true
        type: boolean

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag_name="${{ github.event.inputs.tag_name }}"
            prerelease="${{ github.event.inputs.prerelease }}"
          else
            tag_name="${{ github.event.release.tag_name }}"
            prerelease="${{ github.event.release.prerelease }}"
          fi

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Validate release tag, metadata, and stamped versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: python3 scripts/validate_release_source.py --tag "$RELEASE_TAG" --prerelease "$RELEASE_PRERELEASE"

      - name: Record validated source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  learning-id-assets:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Prepare package directory
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/proflame2-learning-id.XXXXXX")
          echo "OUTPUT_DIR=$directory" >> "$GITHUB_ENV"
      - name: Build inspectable source archive and checksum
        run: make learning-id-package OUTPUT_DIR="$OUTPUT_DIR" PACKAGE_ARGS=--require-clean
      - name: Test release archive before upload
        run: make learning-id-package-test ARCHIVE="$OUTPUT_DIR/proflame2-learning-id.pyz"
      - name: Add helper assets without replacing other release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$OUTPUT_DIR/proflame2-learning-id.pyz" \
            "$OUTPUT_DIR/proflame2-learning-id.pyz.sha256" \
            --repo "$GITHUB_REPOSITORY"
      - name: Clean package outputs
        if: always()
        run: if [[ -n "${OUTPUT_DIR:-}" ]]; then rm -rf -- "$OUTPUT_DIR"; fi
