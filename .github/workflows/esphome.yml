name: ESPHome Validation

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  esphome-config-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esphome: ["2026.8.2", "2026.9.1", "2026.10.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install isolated test and ESPHome environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          python -m venv .venv-esphome
          .venv-esphome/bin/python -m pip install esphome==${{ matrix.esphome }}
      - name: Validate telemetry categories and YAML-only settings
        env:
          ESPHOME_TEST_CLI: .venv-esphome/bin/esphome
        run: .venv/bin/python -m pytest tests/test_lilygo_entity_configuration.py --no-cov -q
      - name: Generate complete display example source (not a firmware compile)
        run: .venv-esphome/bin/esphome compile esphome/validate_display_preset.yaml --only-generate

  esphome-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up firmware host-test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run firmware host tests with coverage
        run: make firmware-unit-test

      - name: Validate and compile ESPHome example
        run: make esphome-validate

      - name: Remove generated firmware outputs
        if: always()
        run: |
          rm -rf .esphome
          rm -rf esphome/.esphome
          rm -rf esphome/examples/.esphome
          rm -f esphome/examples/.gitignore
          find esphome -type d \( -name ".esphome" -o -name "build" -o -name ".pioenvs" -o -name ".piolibdeps" \) -prune -exec rm -rf {} +
