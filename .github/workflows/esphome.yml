name: ESPHome Validation

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  esphome-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up firmware host-test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run firmware TX host tests with coverage
        run: make firmware-unit-test

      - name: Validate and compile ESPHome example
        run: make esphome-validate

      - name: Remove generated firmware outputs
        if: always()
        run: |
          rm -rf .esphome
          rm -rf esphome/.esphome
          rm -rf esphome/examples/.esphome
          rm -f esphome/examples/.gitignore
          find esphome -type d \( -name ".esphome" -o -name "build" -o -name ".pioenvs" -o -name ".piolibdeps" \) -prune -exec rm -rf {} +
